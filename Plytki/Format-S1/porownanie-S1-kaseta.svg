<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">
  <!-- Skala 0,6 px/mm. Wymiary zewnętrzne ze ściankami 3 mm. Szacunek studium S1 (29.09.2026), nie rysunek wykonawczy. -->
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">EGRLab: kaseta R1 a stos S1 (ta sama skala, 0,6 px = 1 mm)</text>
  <text x="20" y="48" fill="#555">Szacunek ±25 %. Stos S1: płytki poziomo, format L ≈ 160 × 100 mm oraz 2/3 i 1/3 długości; wymiary zewnętrzne ze ściankami 3 mm.</text>

  <!-- Widoki z góry -->
  <text x="20" y="80" font-weight="bold">Widok z góry (długość × szerokość)</text>
  <rect x="20" y="92" width="216.6" height="125.4" fill="#f3e6d8" stroke="#8a5a2b" stroke-width="1.5"/>
  <text x="26" y="110">Kaseta R1 LOGGER</text>
  <text x="26" y="126" fill="#555">361 × 209 mm</text>

  <g transform="translate(290,92)">
    <rect x="0" y="0" width="138.6" height="79.8" fill="#dcebf7" stroke="#1f5f99" stroke-width="1.5"/>
    <rect x="1.8" y="1.8" width="30" height="76.2" fill="#fff4cc" stroke="#b08900"/>
    <text x="5" y="44" font-size="9">panel</text>
    <rect x="31.8" y="1.8" width="96" height="10.8" fill="#e2f0d9" stroke="#3c7d22"/>
    <text x="36" y="10" font-size="7.5">płytka połączeń + taśmy</text>
    <rect x="31.8" y="12.6" width="96" height="60" fill="#e8f1fb" stroke="#1f5f99" stroke-dasharray="4 2"/>
    <line x1="63.8" y1="12.6" x2="63.8" y2="72.6" stroke="#1f5f99" stroke-dasharray="2 2"/>
    <line x1="95.8" y1="12.6" x2="95.8" y2="72.6" stroke="#1f5f99" stroke-dasharray="2 2"/>
    <text x="36" y="45" font-size="9">1/3 | 1/3 | 1/3</text>
    <rect x="31.8" y="72.6" width="96" height="5.4" fill="#f9d9d9" stroke="#b03030"/>
    <rect x="127.8" y="1.8" width="9" height="76.2" fill="#eeeeee" stroke="#777"/>
    <text x="0" y="96">Stos S1 LOGGER</text>
    <text x="0" y="112" fill="#555">231 × 133 mm</text>
  </g>

  <g transform="translate(500,92)">
    <rect x="0" y="0" width="138.6" height="79.8" fill="#dcebf7" stroke="#1f5f99" stroke-width="1.5"/>
    <text x="0" y="96">Stos S1 PEŁNY</text>
    <text x="0" y="112" fill="#555">231 × 133 mm</text>
  </g>

  <rect x="700" y="92" width="216.6" height="159" fill="none" stroke="#8a5a2b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="706" y="110">Kaseta R1 PEŁNY</text>
  <text x="706" y="126" fill="#555">361 × 265 mm</text>

  <!-- Widoki z boku -->
  <text x="20" y="300" font-weight="bold">Widok od strony serwisowej (długość × wysokość)</text>
  <rect x="20" y="315" width="216.6" height="90.6" fill="#f3e6d8" stroke="#8a5a2b" stroke-width="1.5"/>
  <text x="26" y="333">Kaseta R1 LOGGER</text>
  <text x="26" y="349" fill="#555">wys. 151 mm, 11,4 l</text>

  <g transform="translate(290,315)">
    <rect x="0" y="0" width="138.6" height="63" fill="#dcebf7" stroke="#1f5f99" stroke-width="1.5"/>
    <rect x="1.8" y="1.8" width="30" height="59.4" fill="#fff4cc" stroke="#b08900"/>
    <rect x="31.8" y="40.4" width="96" height="16" fill="#c9dcf0" stroke="#1f5f99"/>
    <text x="34" y="49.5" font-size="6.5">P02 R4 (2/3) + P10 (1/3)</text>
    <rect x="31.8" y="27.4" width="96" height="13" fill="#b7d0ea" stroke="#1f5f99"/>
    <text x="34" y="35.5" font-size="6.5">P03 (L)</text>
    <rect x="31.8" y="14.4" width="96" height="13" fill="#c9dcf0" stroke="#1f5f99"/>
    <text x="34" y="22.5" font-size="6.5">P05 (2/3) + P09 (1/3)</text>
    <rect x="31.8" y="1.8" width="96" height="12.6" fill="#b7d0ea" stroke="#1f5f99"/>
    <text x="34" y="10" font-size="6.5">P06 (1/3–2/3)</text>
    <!-- kołki serwisowe na krawędzi każdej płytki (dół pasa = płytka) -->
    <g fill="#b03030">
      <rect x="40" y="55.2" width="40" height="1.2"/><rect x="100" y="55.2" width="20" height="1.2"/>
      <rect x="40" y="39.2" width="70" height="1.2"/>
      <rect x="40" y="26.2" width="40" height="1.2"/><rect x="100" y="26.2" width="20" height="1.2"/>
      <rect x="40" y="13.2" width="40" height="1.2"/>
    </g>
    <rect x="127.8" y="1.8" width="9" height="59.4" fill="#eeeeee" stroke="#777"/>
    <text x="0" y="80">Stos S1 LOGGER</text>
    <text x="0" y="96" fill="#555">wys. ok. 105 mm, ok. 3,2 l</text>
  </g>

  <g transform="translate(500,315)">
    <rect x="0" y="0" width="138.6" height="76.2" fill="#dcebf7" stroke="#1f5f99" stroke-width="1.5"/>
    <text x="8" y="40" font-size="9">LOGGER + P04, P07, P08</text>
    <text x="0" y="93">Stos S1 PEŁNY</text>
    <text x="0" y="109" fill="#555">wys. ok. 127 mm, ok. 3,9 l</text>
  </g>

  <rect x="700" y="315" width="216.6" height="90.6" fill="none" stroke="#8a5a2b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="706" y="333">Kaseta R1 PEŁNY</text>
  <text x="706" y="349" fill="#555">wys. 151 mm, 14,5 l</text>

  <!-- Legenda i skala -->
  <g transform="translate(20,450)">
    <rect x="0" y="0" width="14" height="10" fill="#fff4cc" stroke="#b08900"/><text x="20" y="9">panel 50 mm (wtyki DT, przełączniki, BNC)</text>
    <rect x="300" y="0" width="14" height="10" fill="#e2f0d9" stroke="#3c7d22"/><text x="320" y="9">płytka połączeń i taśmy (18 mm)</text>
    <rect x="560" y="0" width="14" height="10" fill="#f9d9d9" stroke="#b03030"/><text x="580" y="9">strona serwisowa: kołki do odbioru (9 mm)</text>
    <rect x="0" y="22" width="14" height="10" fill="#eeeeee" stroke="#777"/><text x="20" y="31">wejścia przewodów: XT60, OBD, VBAT (15 mm)</text>
    <rect x="300" y="22" width="14" height="10" fill="#c9dcf0" stroke="#1f5f99"/><text x="320" y="31">poziom stosu (L albo 2/3 + 1/3)</text>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="55" x2="0" y2="65" stroke="#000"/><line x1="60" y1="55" x2="60" y2="65" stroke="#000"/>
    <text x="70" y="64">100 mm</text>
  </g>
</svg>
