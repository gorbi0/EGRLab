<text x="32.00" y="459.00" font-size="13" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">J4.1 -&gt; 3V3_IO istniejącej płyty</text>
<text x="32.00" y="477.85" font-size="13" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">J4.2 -&gt; SAFE_N = U9 SN74HC74N pin 1 istniejącej płyty</text>
<text x="32.00" y="496.70" font-size="13" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">J4.3 -&gt; GND_STAR</text>
<text x="622.00" y="459.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Przy ENABLE=0 tranzystor Q7 przewodzi i zwiera SAFE_N do masy. Przy ENABLE=1 Q8 blokuje Q7.</text>
<text x="622.00" y="476.40" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Kolektor Q7 nie ma lokalnego pull-up i nie wprowadza 5 V na SAFE_N.</text>
<text x="32.00" y="558.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">M5.J1/J3 zastępują J1.1/J1.2, a M5.J2/J4 zastępują J2.1/J2.2. Stary wejściowy SM8S24CA zastępuje PG.D1 15KPA24CA. F1, F2/F3/F4, KPWR, C_BULK i SMCJ18A przy VMOTOR pozostają.</text>
<text x="32.00" y="631.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Wszystkie oznaczenia na arkuszach 01-05 dotyczą nowego modułu. Nie utożsamiaj PG.Q8 ani PG.U4 z Q8/U4 istniejącej płyty. Napięcie ADC CH7 nadal pobierane jest z VPROT; firmware i pinout ESP32 nie</text>
<text x="32.00" y="648.40" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">wymagają zmiany.</text>
<text x="32.00" y="708.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">Powrót napięcia przywraca VPROT. Ruch silnika wymaga nowego naciśnięcia ARM. Nie łączyć OK/AUX5 bezpośrednio z SAFE_N.</text>
<polyline points="32.00,792.89 1158.55,792.89" fill="none" stroke="#bccbd4" stroke-width="1"/>
