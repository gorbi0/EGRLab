<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.55 841.89">
<rect x="0" y="0" width="1190.55" height="841.89" fill="#ffffff" stroke="#ffffff" stroke-width=".6"/>
<text x="32.00" y="32.00" font-size="11" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#007d77" text-anchor="start">EGRLab  /  PWR-THT v1</text>
<text x="32.00" y="66.00" font-size="24" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">09 / Uruchomienie i protokół odbioru / cd.</text>
<text x="32.00" y="87.00" font-size="10" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#516473" text-anchor="start">Dokumentacja montażowa i wymagania odbiorcze.</text>
<polyline points="32.00,104.00 1158.55,104.00" fill="none" stroke="#bccbd4" stroke-width="1"/>
<text x="32.00" y="132.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">9. Impulsy, silnik i zakres zaliczenia</text>
<text x="32.00" y="157.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Odbiór impulsowy wymaga generatora o znanym przebiegu, impedancji i energii. Zapisz te parametry, temperaturę oraz wyniki</text>
<text x="32.00" y="171.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">dla VS, VPROT, VGS i SAFE_N. Kryteria projektu: VS&lt;=48 V, VPROT&lt;=32 V, |VGS|&lt;18 V; energia w transilach i punkt pracy Q1</text>
<text x="32.00" y="185.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">wewnątrz granic producenta z zapasem temperaturowym. Bez tych pomiarów odporność automotive pozostaje niepotwierdzona.</text>
<text x="32.00" y="199.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Nie wykonuj próby load dump przez odpinanie akumulatora w pracującym samochodzie.</text>
<text x="32.00" y="220.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Dopiero po próbach z atrapą podłącz EGR standalone. Sprawdź załączenie KPWR i prąd ładowania C_BULK 1000 uF. Powtórz</text>
<text x="32.00" y="234.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">hamowanie i zmianę kierunku przy największej dopuszczonej energii, monitorując VMOTOR i VPROT. D3 nie zastępuje lokalnego</text>
<text x="32.00" y="248.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">SMCJ18A przy mostku. Regeneracja nie może być odprowadzana do akumulatora przez D2, dlatego lokalne tłumienie pozostaje</text>
<text x="32.00" y="262.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">konieczne.</text>
<text x="32.00" y="283.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Odporność na zwarcie nie jest potwierdzona samym F1=5 A. Test zwarcia wykonuje się najpierw z ograniczonym źródłem i po</text>
<text x="32.00" y="297.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">ocenie SOA/I²t bezpiecznika; odcięcie programowe silnika nie jest ochroną przed zwarciem przed mostkiem. Wynik ma być</text>
<text x="32.00" y="311.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">oddzielnie zapisany. Nie zwiększaj F1, żeby ukryć przepalanie przy starcie.</text>
<text x="32.00" y="340.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">Protokół</text>
<text x="32.00" y="365.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Próba | Warunki, wynik, data | Zaliczone</text>
<text x="32.00" y="379.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Pinout, izolacja radiatorów | | NIE ZBADANO</text>
<text x="32.00" y="393.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">AUX5/REF stabilność | | NIE ZBADANO</text>
<text x="32.00" y="407.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Start 0 -&gt; 13,8 V i 0 -&gt; 24 V | | NIE ZBADANO</text>
<text x="32.00" y="421.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Zanik AUX5 / INHIBIT | | NIE ZBADANO</text>
<text x="32.00" y="435.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">OVP/UVLO w 0/25/50°C | | NIE ZBADANO</text>
<text x="32.00" y="449.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">SAFE_N, krótki błąd i ponowne ARM | | NIE ZBADANO</text>
<text x="32.00" y="463.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">5 A, temperatura i spadek napięcia | | NIE ZBADANO</text>
<text x="32.00" y="477.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">24 V przez 10 minut, wyjście OFF | | NIE ZBADANO</text>
<text x="32.00" y="491.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Start C&lt;=220 uF / I&lt;=1,5 A i SOA | | NIE ZBADANO</text>
<text x="32.00" y="505.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Czas OVP oraz przepięcie wyjścia | | NIE ZBADANO</text>
<text x="32.00" y="519.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">-14/-24 V, upływ wsteczny | | NIE ZBADANO</text>
<text x="32.00" y="533.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Impulsy: przebieg, impedancja, energia | | NIE ZBADANO</text>
<text x="32.00" y="547.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Zwarcie / koordynacja F1 / SOA | | NIE ZBADANO</text>
<text x="32.00" y="561.00" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">KPWR, silnik, regeneracja | | NIE ZBADANO</text>
<text x="32.00" y="582.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Kopię wypełnionego protokołu dołącz do egzemplarza. „Zaliczone DC” nie oznacza zaliczenia impulsów ani zgody na dowolne</text>
<text x="32.00" y="596.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">warunki pod maską.</text>
<polyline points="32.00,792.89 1158.55,792.89" fill="none" stroke="#bccbd4" stroke-width="1"/>
<text x="32.00" y="811.89" font-size="9" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#647681" text-anchor="start">PROJEKT PROTOTYPU | 22.09.2026 | brak pomiarów sprzętowych / brak kwalifikacji ISO</text>
<text x="1158.55" y="811.89" font-size="10" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="end">11</text></svg>