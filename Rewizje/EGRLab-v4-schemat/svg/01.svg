<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190.551 841.89"><rect width="100%" height="100%" fill="white"/><text x="28.00" y="27.00" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#183743">EGRLab v4</text><text x="168.00" y="27.00" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#183743">Spis arkuszy i legenda</text><text x="28.00" y="49.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">Schemat elektryczny modułowy | Kia Sportage 1.7 CRDi 2013 | rewizja rysunkowa S1</text><polyline points="25.00,62.00 1165.55,62.00" stroke="#153b51" stroke-width="1.5" fill="none"/><text x="40.00" y="112.00" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#183743">Pełny schemat połączeń urządzenia w architekturze modułowej V4</text><text x="40.00" y="146.00" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#183743">Rysunki obejmują zasilanie, interlock, watchdog, bramki, przekaźniki, motor, pomiary, ADC, ESP32, CAN, temperatury, SD oraz trzy adaptery. Węzły łączy się</text><text x="40.00" y="159.00" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#183743">po etykietach również pomiędzy arkuszami.</text><text x="45.00" y="217.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">02  Zasilanie: wejście, OVP i przetwornice</text><text x="45.00" y="247.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">03  Interlock oraz STOP</text><text x="45.00" y="277.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">04  Supervisor, watchdog i zatrzask ARM</text><text x="45.00" y="307.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">05  Bramki zezwolenia i otwarte dreny SAFE_N</text><text x="45.00" y="337.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">06  Komparatory prądu i napięcia</text><text x="45.00" y="367.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">07  Sterownik i gaszenie cewek</text><text x="45.00" y="397.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">08  Mostek H i zasilanie motoru TEST</text><text x="45.00" y="427.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">09  Pomiary prądu TEST / LOGGER</text><text x="45.00" y="457.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">10  Zasilanie sensora i zworki TEST</text><text x="45.00" y="487.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">11  Odczepy EGR i KMEAS</text><text x="610.00" y="217.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">12  AUX HI/LO i pomiar VPROT</text><text x="610.00" y="247.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">13  AD7606B: wszystkie 64 piny</text><text x="610.00" y="277.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">14  ESP32-S3 i ekspander MCP23017</text><text x="610.00" y="307.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">15  Termopary, SD oraz CAN/OBD</text><text x="610.00" y="337.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">16  Złącza panelowe i przyciski</text><text x="610.00" y="367.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">17  Adapter T: rezystory przy EGR</text><text x="610.00" y="397.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">18  Adapter L1: rezystory przy EGR</text><text x="610.00" y="427.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">19  Adapter L2: rezystory przy EGR</text><text x="610.00" y="457.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">20  Rezystory pomocnicze i stany domyślne</text><text x="610.00" y="487.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">21  Filtry okien i odniesienia</text><text x="610.00" y="517.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">22  Odsprzęganie układów i modułów</text><text x="610.00" y="547.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#183743">23  Doprecyzowanie OVP i złącza OEM</text><text x="40.00" y="574.00" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#183743">Jak czytać schemat</text><polyline points="40.00,581.00 1140.00,581.00" stroke="#c2cdd3" stroke-width="0.65" fill="none"/><text x="40.00" y="603.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">Zielona linia: przewód. Niebieska etykieta: nazwa sieci. Kropka: połączenie. Krzyżyk: pin celowo niepodłączony. AGND / DGND / PGND łączą się wyłącznie w</text><text x="40.00" y="616.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">GND_STAR na arkuszu 02. NC nigdy nie jest wspólną siecią.</text><text x="40.00" y="648.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">G6K: styki pokazane bez zasilania cewki. M1/M2/M3/M4/M5, TC1/TC2 i SD1 są gotowymi modułami - zaciski oznaczono nazwami na płytkach. Ich elektroniki fabrycznej</text><text x="40.00" y="661.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">nie buduje się ponownie według tych arkuszy.</text><text x="40.00" y="693.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">S1 doprecyzowuje zapisy V4: dodaje pominięte w CSV kondensatory VMOTOR, pola zworek, LED i jednoznaczne zakończenia. Szczegóły oraz otwarte punkty montażowe:</text><text x="40.00" y="706.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">UWAGI-S1.md. To schemat, nie projekt PCB ani potwierdzenie działania egzemplarza.</text><polyline points="25.00,778.00 1165.55,778.00" stroke="#153b51" stroke-width="1" fill="none"/><text x="28.00" y="795.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">EGRLab v4 / S1 | 22.09.2026 | A3 poziomo | identyczne etykiety = połączenie elektryczne</text><text x="28.00" y="812.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">Moduły kupne pokazano przez ich zaciski. Widok pinów IC od góry. Odbiór sprzętu wg V4 nadal wymagany.</text><text x="1162.55" y="808.00" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#183743">01 / 23</text></svg>