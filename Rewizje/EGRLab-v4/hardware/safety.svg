<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="890" viewBox="0 0 1300 890"><rect width="100%" height="100%" fill="#f7fafc"/><text x="40" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#173b50">EGRLab v4 · sprzętowa blokada i reset watchdoga</text><rect x="35" y="100" width="265" height="108" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="49" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">U5 · TPS3808G33</text><text x="49" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">RESET → SUP_N</text><text x="49" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Osobny pull-up 10 kΩ</text><rect x="400" y="100" width="350" height="108" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="414" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">U7 · CD74HC123</text><text x="414" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">/CLR = SUP_N; B = heartbeat</text><text x="414" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Q → U8a → Q8</text><polyline points="300,154 400,154" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="400.0,154.0 389.0,149.0 389.0,159.0" fill="#477b86"/><rect x="870" y="100" width="390" height="108" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="884" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Q8 · watchdog</text><text x="884" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Q9 · supervisor przez U8c</text><text x="884" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Q10 · interlock przez U8d</text><polyline points="750,154 870,154" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="870.0,154.0 859.0,149.0 859.0,159.0" fill="#477b86"/><rect x="35" y="300" width="410" height="110" rx="12" fill="#fff0d5" stroke="#547b8a" stroke-width="2"/><text x="49" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">3V3_IO → STOP.NC → 10 kΩ</text><text x="49" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Jedyny pull-up SAFE_N</text><text x="49" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">100 kΩ z SAFE_N do GND</text><rect x="555" y="300" width="280" height="110" rx="12" fill="#ffe8d8" stroke="#547b8a" stroke-width="2"/><text x="569" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">SAFE_N</text><text x="569" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Tylko otwarte wyjścia</text><text x="569" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Nie jest węzłem SUP_N</text><polyline points="445,355 555,355" fill="none" stroke="#a47834" stroke-width="3"/><polygon points="555.0,355.0 544.0,350.0 544.0,360.0" fill="#a47834"/><polyline points="1060,208 1060,264 698,264 698,300" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="698.0,300.0 703.0,289.0 693.0,289.0" fill="#477b86"/><rect x="35" y="480" width="410" height="110" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="49" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">U4: okno prądu ±4 A</text><text x="49" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">U6: okno 5V_A 4,75–5,25 V</text><text x="49" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Oba wyjścia open collector</text><polyline points="445,532 492,532 492,380 555,380" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="555.0,380.0 544.0,375.0 544.0,385.0" fill="#477b86"/><rect x="920" y="310" width="340" height="108" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="934" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">U9 · HC74 latch</text><text x="934" y="366" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">/CLR = SAFE_N; D = /PRE = 1</text><text x="934" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">CLK = fizyczne ARM po HC14</text><polyline points="835,355 920,355" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="920.0,355.0 909.0,350.0 909.0,360.0" fill="#477b86"/><rect x="555" y="505" width="705" height="126" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="569" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">MOTOR_PERMIT = HW_ARMED &amp; MCU_ARM &amp; INTERLOCK</text><text x="569" y="561" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">PWM_OUT = PWM &amp; MOTOR_PERMIT</text><text x="569" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">SENSOR_PERMIT = ENABLE &amp; KEY &amp; INTERLOCK &amp; SAFE_N</text><text x="569" y="613" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Osobny driver cewek; VDD mostka z MOTOR_PERMIT</text><polyline points="1100,418 1100,505" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="1100.0,505.0 1105.0,494.0 1095.0,494.0" fill="#477b86"/><text x="35" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173b50">U7: R = 220 kΩ do pinu 15; C = 1 µF między pinami 14–15. C nie jest zwarty do masy.</text><text x="35" y="750" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173b50">Po błędzie wymagane nowe zbocze ARM. Powrót heartbeat lub wyjęcie LOGGER nie uzbraja.</text><text x="35" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173b50">Ten rysunek wyjaśnia logikę. Fizyczne numery nóżek oraz elementy RC: CSV i rozdział 07.</text><text x="35" y="840" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173b50">Odbiór: timeout 50–150 ms; osobno zmierz progi OC i rzeczywisty czas odcięcia napędu.</text></svg>