 font-weight="400" text-anchor="middle" fill="#183743">3,48 kΩ / 0,1%</text><text x="955.13" y="160.00" font-family="Segoe UI,Arial,sans-serif" font-size="6.5" font-weight="400" text-anchor="end" fill="#183743">1</text><text x="997.13" y="160.00" font-family="Segoe UI,Arial,sans-serif" font-size="6.5" font-weight="400" text-anchor="start" fill="#183743">2</text><text x="40.00" y="209.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">M5_R8/R3/R4 oznaczają elementy WEWNĄTRZ modułu TI. W rewizji SLVUBU3A fabrycznie: R8=9,1 kΩ, R3=91 kΩ, R4=3,48 kΩ. Górna gałąź to R8+R3. S1: R3=38,3 kΩ;</text><text x="40.00" y="222.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">R8 i R4 pozostają nominalnie jak wyżej (zalecana tolerancja 0,1%).</text><text x="40.00" y="263.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">M5_OV -&gt; pin 5 (OV) układu U1 na EVM. M5_VIN_MON to istniejący węzeł pomiędzy R8 i R3. J6 2-3 wybiera napięcie wejściowe. Nie dodawaj drugiego dzielnika</text><text x="40.00" y="276.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">obok istniejącego. Vtrip=1,231*(1+(9,1+38,3)/3,48)=17,998 V. Ostateczny próg ustaw pomiarem.</text><text x="305.00" y="366.00" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#183743">OEM_T  Zawór / sondy T</text><rect x="182.0" y="396" width="246" height="68" stroke="#172f3d" stroke-width="0.9" fill="#ffffff"/><polyline points="182.00,412.00 162.00,412.00" stroke="#267146" stroke-width="0.85" fill="none"/><text x="162.00" y="408.00" font-family="Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#15538b">T_EGR_P1</text><text x="187.00" y="415.00" font-family="Segoe UI,Arial,sans-serif" font-size="7.7" font-weigh