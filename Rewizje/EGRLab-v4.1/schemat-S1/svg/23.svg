. Odbiór sprzętu wg V4 nadal wymagany.</text><text x="1162.55" y="808.00" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#183743">23 / 23</text></svg>