/><text x="552.00" y="718.00" font-family="Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="400" text-anchor="end" fill="#15538b">STOP_PRESSED</text><text x="348.00" y="742.00" font-family="Segoe UI,Arial,sans-serif" font-size="7" font-weight="400" text-anchor="start" fill="#183743">NO</text><text x="660.00" y="620.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">Łańcuch: 3V3_IO -&gt; SW_MODE -&gt; LOG1.A NC -&gt; LOG2.A NC -&gt; T.10 -&gt;</text><text x="660.00" y="633.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">mostek w adapterze -&gt; T.11 -&gt; INTERLOCK. Wyjęcie T albo włożenie</text><text x="660.00" y="646.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">L1/L2 rozłącza sprzętowe zezwolenie.</text><text x="660.00" y="701.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">B4 LOGGER_CLEAR=1 oznacza oba gniazda LOGGER puste. Styki A/B</text><text x="660.00" y="714.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">nie są elektrycznie połączone. Pull-downy wejść: arkusz</text><text x="660.00" y="727.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">rezystorów pomocniczych.</text><polyline points="25.00,778.00 1165.55,778.00" stroke="#153b51" stroke-width="1" fill="none"/><text x="28.00" y="795.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">EGRLab v4 / S1 | 22.09.2026 | A3 poziomo | identyczne etykiety = połączenie elektryczne</text><text x="28.00" y="812.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">Moduły kupne pokazano przez ich zaciski. Widok pinów IC od góry. Odbiór sprzętu wg V4 nadal wymagany.</text><text x="1162.55" y="808.00" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#183743">03 / 23</text></svg>