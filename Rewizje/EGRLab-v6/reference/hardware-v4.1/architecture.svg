ont-size="18" fill="#173b50">VPROT / AUX HI–LO</text><text x="464" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">AD7606B · 8 × 16 bit</text><text x="464" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">SPI2 · 2000 próbek/s</text><polyline points="355,186 405,186 405,223 450,223" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="450.0,223.0 439.0,218.0 439.0,228.0" fill="#477b86"/><polyline points="355,344 405,344 405,309 450,309" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="450.0,309.0 439.0,304.0 439.0,314.0" fill="#477b86"/><rect x="850" y="170" width="380" height="220" rx="12" fill="#e4f0f4" stroke="#547b8a" stroke-width="2"/><text x="864" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">ESP32-S3 · rdzeń akwizycji</text><text x="864" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">PAUSE / ACK / konfiguracja / RESUME</text><text x="864" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">PSRAM: 8 MiB danych RAW</text><text x="864" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">SD: segmenty RAW i NDJSON</text><text x="864" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">TC1 / TC2 + CAN listen-only</text><text x="864" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">UART; Wi-Fi opcjonalne TEST</text><polyline points="750,274 850,274" fill="none" stroke="#477b86" stroke-width="3"/><polygon points="850.0,274.0 839.0,269.0 839.0,279.0" fill="#477b86"/><rect x="40" y="515" width="710" height="116" rx="12" fill="#fff0d5" stroke="#547b8a" stroke-width="2"/><text x="54" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Sprzętowe zezwolenie</text><text x="54" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">STOP + interlock + OC + okno 5V_A + watchdog</text><text x="54" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">SUP_N niezależne od SAFE_N → latch fizycznego ARM</text><rect x="850" y="515" width="380" height="116" rx="12" fill="#fff0d5" stroke="#547b8a" stroke-width="2"/><text x="864" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Zasilanie 12 V</text><text x="864" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">TVS + LM74800 OVP ~18 V</text><text x="864" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">5V_SYS / 5V_A / 3V3_IO</text><polyline points="190,515 190,425" fill="none" stroke="#a47834" stroke-width="3"/><polygon points="190.0,425.0 185.0,436.0 195.0,436.0" fill="#a47834"/><polyline points="1040,390 1040,515" fill="none" stroke="#477b86" stroke-width="3"/><text x="40" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173b50">Jednocześnie tylko jeden adapter. Numeracja styków: connectors.csv; piny układów: ic-pins.csv.</text><text x="40" y="742" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173b50">Dokumentacja montażu modułowego; brak wykonanej PCB i pomiarów fizycznego egzemplarza.</text></svg>