ize="8" font-weight="400" text-anchor="start" fill="#15538b">5V_A</text><text x="1150.55" y="598.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#15538b">AGND</text><polyline points="611.28,610.00 864.91,610.00" stroke="#267146" stroke-width="0.85" fill="none"/><polyline points="896.91,610.00 1150.55,610.00" stroke="#267146" stroke-width="0.85" fill="none"/><polyline points="864.91,610.00 877.91,610.00" stroke="#172f3d" stroke-width="0.85" fill="none"/><polyline points="883.91,610.00 896.91,610.00" stroke="#172f3d" stroke-width="0.85" fill="none"/><polyline points="877.91,601.00 877.91,619.00" stroke="#172f3d" stroke-width="1.4" fill="none"/><polyline points="883.91,601.00 883.91,619.00" stroke="#172f3d" stroke-width="1.4" fill="none"/><text x="880.91" y="586.00" font-family="Segoe UI,Arial,sans-serif" font-size="8.4" font-weight="700" text-anchor="middle" fill="#183743">C_A</text><text x="880.91" y="633.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#183743">470uF 10V</text><text x="859.91" y="622.00" font-family="Segoe UI,Arial,sans-serif" font-size="6.5" font-weight="400" text-anchor="end" fill="#183743">1</text><text x="901.91" y="622.00" font-family="Segoe UI,Arial,sans-serif" font-size="6.5" font-weight="400" text-anchor="start" fill="#183743">2</text><text x="40.00" y="660.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">M5: J1=wejście +, J3=masa wejścia, J2=wyjście +, J4=masa wyjścia. J6 2-3 = input cutoff. Dzielnik OVP ma TRZY rezystory: R8=9,10 kΩ, R3=38,3 kΩ, R4=3,48 kΩ.</text><text x="40.00" y="673.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">Szczegóły modyfikacji fabrycznego EVM: arkusz 23.</text><text x="40.00" y="706.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">OVP nominalnie 18,00 V; pomiar odbiorczy 17,5-18,5 V. F1=5 A dla bazowego EVM. AGND, DGND i PGND prowadź osobnymi powrotami do GND_STAR = J_PWR.2 = B-</text><text x="40.00" y="719.00" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#183743">akumulatora. OBD 4/5/16 pozostają NC.</text><polyline points="25.00,778.00 1165.55,778.00" stroke="#153b51" stroke-width="1" fill="none"/><text x="28.00" y="795.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">EGRLab v4 / S1 | 22.09.2026 | A3 poziomo | identyczne etykiety = połączenie elektryczne</text><text x="28.00" y="812.00" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#183743">Moduły kupne pokazano przez ich zaciski. Widok pinów IC od góry. Odbiór sprzętu wg V4 nadal wymagany.</text><text x="1162.55" y="808.00" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#183743">02 / 23</text></svg>