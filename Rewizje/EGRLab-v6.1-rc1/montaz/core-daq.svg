<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial" font-size="18"><text x="35" y="42" font-size="26" font-weight="bold">6.1-rc1 — CORE–DAQ: bezpośrednie złącze płytka–płytka</text><rect x="65" y="205" width="500" height="30" rx="5" fill="#89b9a1" stroke="#476173"/><text x="90" y="192" font-size="18">P03 CORE — połączenie z P05 bez kabla</text><rect x="490" y="355" width="510" height="30" rx="5" fill="#89b9a1" stroke="#476173"/><text x="670" y="420" font-size="18">P05 DAQ — analog poza CORE</text><rect x="495" y="235" width="50" height="120" rx="5" fill="#334d60" stroke="#476173"/><text x="620" y="277" font-size="17">SSW-108-01-G-D / TSW-108-07-G-D</text><text x="620" y="310" font-size="17">2 × 8; pozycja 2 usunięta i zaślepiona</text><rect x="450" y="140" width="16" height="300" rx="5" fill="#d9dfe5" stroke="#476173"/><rect x="585" y="140" width="16" height="300" rx="5" fill="#d9dfe5" stroke="#476173"/><text x="85" y="465" font-size="18">Oddzielne podpory obu PCB; złącze nie przenosi obciążeń mechanicznych.</text><text x="85" y="500" font-size="18">Asymetryczna prowadnica blokuje obrót i przesunięcie złącza.</text><text x="85" y="535" font-size="18">Rozstaw podpór i wysokość ustalić z rzeczywistym złączem przed layoutem.</text><text x="85" y="570" font-size="16">Widok zasady z boku, bez skali. 3V3_CORE i 3V3_IO pozostają rozdzielone.</text></g></svg>