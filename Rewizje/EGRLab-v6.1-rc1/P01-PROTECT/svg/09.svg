<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.55 841.89">
<rect x="0" y="0" width="1190.55" height="841.89" fill="#ffffff" stroke="#ffffff" stroke-width=".6"/>
<text x="32.00" y="32.00" font-size="11" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#007d77" text-anchor="start">EGRLab  /  PWR-THT v1</text>
<text x="32.00" y="66.00" font-size="24" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">08 / Obliczenia, zakres ochrony i źródła / cd.</text>
<text x="32.00" y="87.00" font-size="10" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#516473" text-anchor="start">Dokumentacja montażowa i wymagania odbiorcze.</text>
<polyline points="32.00,104.00 1158.55,104.00" fill="none" stroke="#bccbd4" stroke-width="1"/>
<text x="32.00" y="132.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">oznaczałyby setki dżuli do rozproszenia; oznaczenie 15 kW transila nie uzasadnia takiej zdolności. Wymagania dla testu</text>
<text x="32.00" y="146.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">samochodowego muszą wynikać z wybranego przebiegu i energii, a nie z samej nazwy elementu. Próbę wykonuje się</text>
<text x="32.00" y="160.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">odpowiednim generatorem; nie odłącza się akumulatora podczas pracy silnika.</text>
<text x="32.00" y="189.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">Układ mechaniczny</text>
<text x="32.00" y="214.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Zaprojektowano montaż ręczny, bez WSON/QFN. Płytka uniwersalna FR4 około 100 x 160 mm może służyć prototypowi; to nie</text>
<text x="32.00" y="228.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">projekt gotowego PCB. Tor 5 A wykonaj przewodem miedzianym 1,5-2,5 mm², bez prowadzenia go ścieżkami płytki stykowej.</text>
<text x="32.00" y="242.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Mocowania złączy i dużych transili muszą przenosić obciążenia mechaniczne.</text>
<text x="32.00" y="263.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">D1 umieść przy wejściu, D3 przy Q1/J2. Pętle transili do masy mają być możliwie krótkie i szerokie. Masę U2/U3 poprowadź</text>
<text x="32.00" y="277.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">osobno do GND_STAR, z dala od prądu impulsowego D1/D3. Q2, R27, D4, C5 i C6 umieść przy Q1. R1, R23, radiatory i transile</text>
<text x="32.00" y="291.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">odsuń od TL431/D6 oraz dzielników progowych. Nie dokładaj filtrów RC na OVP bez pomiaru czasu odcięcia.</text>
<text x="32.00" y="320.00" font-size="12" font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="#173242" text-anchor="start">Źródła producentów</text>
<text x="32.00" y="345.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Weryfikowane 22.09.2026. Dane elementów nie są wynikami pomiaru kompletnego modułu.</text>
<text x="32.00" y="366.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">1. Vishay SUP53P06-20, doc. 68633: https://www.vishay.com/docs/68633/sup53p06-20.pdf</text>
<text x="32.00" y="380.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">2. ST STPS20100CT: https://www.st.com/resource/en/datasheet/stps20100.pdf</text>
<text x="32.00" y="394.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">3. TI LM2903/LM393, SLCS005AH, zwłaszcza tablice 5.10 i 5.11: https://www.ti.com/lit/ds/symlink/lm393.pdf</text>
<text x="32.00" y="408.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">4. TI LM2936, SNOSC48O, pinout i sekcja 8.2: https://www.ti.com/lit/ds/symlink/lm2936.pdf</text>
<text x="32.00" y="422.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">5. TI TL431, SLVS543S, obudowa LP: https://www.ti.com/lit/ds/symlink/tl431.pdf</text>
<text x="32.00" y="436.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">6. Microchip MCP120/130, DS11184D: https://ww1.microchip.com/downloads/en/devicedoc/11184d.pdf</text>
<text x="32.00" y="450.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">7. Littelfuse 15KPA:</text>
<text x="32.00" y="464.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">https://www.littelfuse.com/assetdocs/tvs-diodes-15kpa-datasheet?assetguid=5152edba-6eab-4c4a-9bef-2c97b144328e</text>
<text x="32.00" y="478.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">8. Littelfuse 5KP:</text>
<text x="32.00" y="492.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">https://www.littelfuse.com/~/media/electronics/datasheets/tvs_diodes/littelfuse_tvs_diode_5kp_datasheet.pdf.pdf</text>
<text x="32.00" y="506.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">9. Vishay 1.5KE, doc. 88301: https://www.vishay.com/docs/88301/15ke.pdf</text>
<text x="32.00" y="520.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">10. Vishay BZX55, doc. 85604: https://www.vishay.com/docs/85604/bzx55.pdf</text>
<text x="32.00" y="534.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">11. onsemi 2N5551: https://www.onsemi.com/download/data-sheet/pdf/2n5550-d.pdf</text>
<text x="32.00" y="548.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">12. onsemi 2N5401: https://www.onsemi.com/download/data-sheet/pdf/2n5401-d.pdf</text>
<text x="32.00" y="562.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">13. Bourns 3296: https://www.bourns.com/docs/product-datasheets/3296.pdf</text>
<text x="32.00" y="583.00" font-size="9.5" font-family="Segoe UI,Arial,sans-serif" font-weight="400" fill="#173242" text-anchor="start">Nie dołączono kopii kart katalogowych do paczki; powyższe odnośniki identyfikują źródła do kontroli przed zakupem.</text>
